[project]
name = "elena"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Gael Borchardt", email = "gaelborchardt@gmail.com" }
]
requires-python = ">=3.14.7"
dependencies = [
    "psycopg[binary,pool]>=3.3.6",
    "pydantic-settings>=2.15.0",
    "typer>=0.27.3",
]

[project.scripts]
elena = "elena:main"
elena-fuel = "elena.cli:app"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]
